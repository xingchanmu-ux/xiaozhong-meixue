    <script>    const STYLES = ['超现实暗黑童话','旧未来主义','神性极简','赛博田园','云端造梦','海湾度假风','浮世绘暗夜','怪核','刚性柔美','洛可可废土'];
    const STYLE_EN = { '超现实暗黑童话':'Surreal Dark Fairy Tale','旧未来主义':'Retro-futurism','神性极简':'Sacred Minimalism','赛博田园':'Cyberpastoral','云端造梦':'Cloudcore','海湾度假风':'Coastal Grandmother','浮世绘暗夜':'Yami-Ukiyo-e','怪核':'Weirdcore','刚性柔美':'Tough Soft','洛可可废土':'Rococo Wasteland' };
    const STYLE_COLORS = { '超现实暗黑童话':'#5b1a2a','旧未来主义':'#e07b1a','神性极简':'#8a7a5a','赛博田园':'#4a6a3c','云端造梦':'#5a9a95','海湾度假风':'#3a6a95','浮世绘暗夜':'#1a2a4a','怪核':'#5a7a5a','刚性柔美':'#6c5c4c','洛可可废土':'#a4786a' };
    const STYLE_DETAIL = {
        '超现实暗黑童话': { subtitle:'你是一首用暗处写的摇篮曲', visual:'森林深处的石砌城堡，墙缝里长着深红色的苔藓。彩色玻璃把月光切碎，投在地面上变成暗红、紫蓝和琥珀色的光斑。一只穿斗篷的兔子坐在台阶上，怀里抱着一只缺了耳朵的布偶。空气里有湿木头和旧铁的气味。远处传来不知名的鸟叫，像在喊一个被遗忘的名字。', def:'以哥特建筑、民间传说和超现实主义绘画为基底，将童真的叙事外壳与黑暗的内核并置的视觉文学流派。', features:['物性反转——动物像人一样行事，但保留了动物的冷眼。人与非人的界限被刻意模糊。','童谣式恐怖——恐怖感来自"不合时宜"：漂亮的裙子上有血迹，甜美的笑容下牙齿太尖。','异色温情——在黑暗的缝隙里藏一点柔软。怪物也会孤独，女巫也会种花。'], movie:'《潘神的迷宫》', book:'《安徒生童话全集》（原版）', outfit:'暗红丝绒裙、黑色蕾丝领结、银色细链、旧皮靴', personality:'喜欢超现实暗黑童话的人，往往在很小的时候就学会了"看穿"。你不容易被表面的美好欺骗，但你也因此比大多数人更懂得欣赏"不完美"里的美——比如枯枝的线条、旧物的痕迹、一个结局不那么圆满的故事。你对世界的温柔是带刺的。你不说空洞的安慰，但你在别人难过的时候，会默默递上一杯热茶，然后坐在旁边不说话。你相信黑暗是可以被讲述的，而一旦被讲出来，它就不再那么重了。', tags:['通透','悲悯','温柔的冷'] },
        '旧未来主义': { subtitle:'你相信过去曾许诺过一个更好的未来', visual:'一间墙壁刷成亮橙色的房间，角落摆着一台圆润的旧式电视机，屏幕上闪着雪花点。桌上有一只彩色塑料托盘，上面放着几个几何形状的糖果盒。窗外是画上去的星空——星星是五角形的，月亮弯得像一个微笑。一切都干净、明亮、带着一种天真的确信。', def:'20世纪中期人们对未来的想象——用当时的眼光去构建明天，充满了乐观、色彩和流线型的设计。', features:['乐观的科幻——科技不会带来灾难，而是带来更舒适的生活。飞行汽车、月球度假村、家用机器人。','塑料与流线——材质以鲜艳的塑料、玻璃纤维和镀铬金属为主，造型圆润无棱角。','太空时代的日常化——把太空元素融入日常：火箭形状的台灯、星球图案的壁纸。'], movie:'《2001太空漫游》', book:'《华氏451》', outfit:'高饱和色块、PVC材质、几何形耳环、白色短靴', personality:'喜欢旧未来主义的人，心里大概还留着一点"相信"。你未必真的觉得世界会变好，但你愿意怀念那个曾经相信世界会变好的年代。你对旧东西有一种特别的情感——不是因为它旧，而是因为它曾经很新、很亮、很笃定。你可能会被"未完成"的东西吸引。一张草图、一个概念、一段还没有变成现实的设想——你觉得这些比完成品更有生命力。', tags:['怀旧的乐观','有好奇心','相信可能性'] },
        '神性极简': { subtitle:'你擅长在安静中听见自己', visual:'一间挑高很高的房间，四面白墙，没有装饰。地面上有一道窄长的光，从高处的窗口斜斜切下来，照亮了墙角的一只粗陶瓶，瓶里插着两枝干枯的野花。除此之外，什么都没有。你能听见自己的呼吸，还有光落在皮肤上那种几乎听不见的声音。', def:'一种以极简为形式、以精神性为内核的设计美学——用最少的物质，制造最大的感知空间。', features:['留白即内容——不是"什么都没有"，而是"什么都让给你去填"。','材质诚实——石头、木头、石灰、亚麻。不抛光、不上色、不伪装。','光作为建筑材料——光线被当作一种实体来设计。'], movie:'《降临》', book:'《禅与摩托车维修艺术》', outfit:'羊绒大衣、素色直筒裙、无标皮带、旧皮革包', personality:'喜欢神性极简的人，往往对"多余"很敏感。你可能不太喜欢过度包装的东西——无论是礼物盒还是人际关系。你看重的是事物的本质，而不是它被呈现出来的样子。你可能也有一点"空间洁癖"。倒未必是打扫得很勤快，而是你对环境里的信息量有很高的要求——东西可以少，但要精；话可以少，但要准。', tags:['克制','专注','对质感诚实'] },
        '赛博田园': { subtitle:'你爱这个世界，包括它变坏的部分', visual:'一片稻田在夜色里泛着微光，稻穗上挂着细小的LED灯，像萤火虫落错了地方。远处有一架农用无人机缓缓飞过，指示灯在黑暗中一明一灭。田埂边立着一根生锈的铁柱，上面爬满了藤蔓，藤蔓间夹着几根裸露的电线。风里有青草的气味，也有轻微的电流声。', def:'在数字艺术和科幻插画中兴起，将高科技元素植入自然景观，描绘一种技术与自然共生的未来图景。', features:['温柔的技术——科技不侵略自然，而是像藤蔓一样附着其上。','衰败的美感——东西可以用到旧、用到坏，不必永远崭新。','后人类乡愁——对"回到土地"的渴望，但又离不开屏幕和信号。'], movie:'《星际穿越》', book:'《仿生人会梦见电子羊吗？》', outfit:'工装外套、胶靴、暖色格子衬衫、旧背包', personality:'喜欢赛博田园的人，大概是在城市里生活、但心里一直想逃到乡下那种人。你未必真的逃得了，但你会在阳台上种几盆薄荷、周末骑车去河边、关注一个讲种植的博主。你是用细小的行动在维护一种"平衡感"。你大概也不怕"旧"。你不介意东西上有痕迹、有磨损。你觉得那才是活的。', tags:['平衡感','有根性','不追求崭新'] },
        '云端造梦': { subtitle:'你还没有忘记怎么相信柔软的东西', visual:'一间浅薄荷色的房间，墙角堆满了蓬松的靠垫和毛绒玩具。天花板上悬挂着几团棉花糖形状的灯，发出暖黄色的光。窗外是大片的粉蓝色云海，远远能看到几座漂浮的小岛，岛上长着发光的树。你坐在地毯上，膝盖上摊着一本画册，里面的小动物都穿着不合身的衣服。', def:'2020年前后在数字艺术中兴起的一种轻盈、梦幻、低龄感的视觉风格，以柔软的形态和糖果色系为主。', features:['去重力感——漂浮、悬挂、轻盈。物体不在地面上，而是悬在半空中。','糖果色系——浅粉、薄荷、淡紫、奶黄。颜色像被水洗过。','童趣的严肃——看起来像给孩子看的，但内核是"不愿长大"的自觉选择。'], movie:'《头脑特工队》', book:'《小王子》', outfit:'宽松针织衫、毛绒包、圆头平底鞋、云朵形状的耳坠', personality:'喜欢云端造梦的人，大概是在某一个时刻决定"不成为大人"的那种人。你未必真的拒绝成长，但你拒绝变得冷漠。你会在包里放一颗糖、在路上拍一朵云、在备忘录里写一些没头没尾的诗。你柔软，但不代表你很弱。你只是觉得：硬邦邦的东西已经够多了，为什么我不能软一点呢。', tags:['柔软','有童真','主动保持善意'] },
        '海湾度假风': { subtitle:'你心里住着一个不需要赶时间的人', visual:'米白色亚麻窗帘被海风吹起一角，阳光斜斜地落在水磨石地面上。窗外是深浅不一的蓝——近处的海水是薄荷色的，远处是钴蓝，再远一点，天和海融成一条线。你坐在藤编椅上，手边有一杯半满的柠檬水，杯壁凝着水珠。猫蜷在脚边，书翻到一半扣在膝盖上。', def:'一种以地中海沿岸中产生活为原型、强调自然光线、天然材质和慢节奏的日常审美。', features:['光线崇拜——空间里最重要的元素不是家具，而是光进来的方式。','材质优先——亚麻、藤编、陶土、水磨石、旧木头。','松弛感即风格——不追求完美，追求"刚好"。'], movie:'《请以你的名字呼唤我》', book:'《托斯卡纳艳阳下》', outfit:'亚麻衬衫、草编包、玳瑁墨镜、平底凉鞋', personality:'喜欢海湾度假风的人，往往对"呼吸感"有很高的要求。你并不拒绝复杂，但拒绝不必要的复杂。你知道什么是好的，但不一定要拥有它——远远看一眼，知道它在那里，就已经够好了。你擅长用小事哄自己开心：一杯好茶、一段没有安排的时间、一件摸起来舒服的衣服。你不慌张。你相信日子是过出来的，不是赶出来的。', tags:['松弛','敏锐','自足'] },
        '浮世绘暗夜': { subtitle:'你着迷于那些转瞬即逝的灿烂', visual:'深夜的海边，浪涛翻卷成深蓝和墨黑。远处有一场烟花正在散开——金色、红色、紫色，在夜空里划出弧线，然后像泪一样落下来。岸边站着一个穿灰色和服的女子，风把她的袖口吹得微微扬起。她的表情看不清，但她的背影很安静。', def:'日本浮世绘中的暗黑分支，以月冈芳年等画师为代表，描绘妖异、恐怖、华丽的画面，捕捉人世间的无常与绮丽。', features:['浮华与死亡并列——樱花和骷髅、美人和血迹、烟花和暗夜。','妖异的细节——妖怪、幽灵出现在日常场景里，用平静的方式带来不安。','江户时代的迷幻感——用色浓烈、构图大胆，有酒精一样的眩晕感。'], movie:'《怪化猫》', book:'《百鬼夜行抄》', outfit:'暗纹和服外套、木屐、细银链、带图案的团扇', personality:'喜欢浮世绘暗夜的人，大概对"美"有一种近乎贪心的恋慕——你看烟花的时候不会拍照，你只是认真地看，因为你不知道它下一次还会不会这么好看。你着迷的其实是"时间"本身：它在流动、在带走、在不可挽回。你也许比身边的人更能接受不圆满。你不太说"永远"，你觉得说出来就不太可信了。', tags:['懂告别','贪恋灿烂','不轻信永恒'] },
        '怪核': { subtitle:'你对熟悉的东西保持警惕', visual:'一条铺着菱格地砖的走廊，日光灯管在天花板上嗡嗡作响。墙壁是淡绿色的，上面挂着一只旧钟，指针停在四点十七分。走廊尽头是一扇半开的门，门缝里透出一丝暖黄色的光，但看不到里面是什么。空气里有消毒水和灰尘混合的气味。', def:'以低画质图像、阈限空间和模糊的记忆片段为特征的网络美学，制造一种"熟悉但不对劲"的不安感。', features:['阈限空间——过渡性的场所：走廊、楼梯间、停车场。','画质的怀旧感——低像素、模糊、过曝。图像质量本身就在说话。','日常的不安——东西都是你见过的，但就是哪里不太对。'], movie:'《皮囊之下》', book:'《没有个性的人》', outfit:'旧校服外套、褪色卫衣、磨损的帆布鞋', personality:'喜欢怪核的人，大概是一个不愿意轻易被安慰的人。你对"一切都会好起来"这种话保持礼貌的怀疑。你更信任那些无法解释的感受——走在一段陌生的走廊里忽然觉得来过、在一个陌生的城市忽然觉得想哭。你可能也不喜欢被定义。别人说"你是一个温暖的人"，你觉得"也不完全对"。你宁愿保持一点模糊感。', tags:['警觉','记忆厚重','不接受俗套的安慰'] },
        '刚性柔美': { subtitle:'你既是铁，也是铁上开出的花', visual:'一间挑高的混凝土厂房，阳光从高窗斜射进来，落在抛光的不锈钢桌面上。桌上有一只陶土花瓶，插着一枝干枯的尤加利叶。墙壁是裸露的清水混凝土，但地面铺着一小块手工编织的旧地毯——深红色，有磨损的痕迹，边角微微翘起。', def:'一种在时尚、设计和建筑领域兴起的风格，以矛盾材质的并置为核心——粗粝与精致、冷峻与温暖、工业与手作。', features:['材质对话——混凝土×丝绒、不锈钢×羊毛、玻璃×粗麻。','拒绝伪装——不把水泥刷成大理石，不把塑料做成木头。材料是什么就是什么。','力量的脆弱性——承认最坚固的东西往往也有最细微的裂纹。'], movie:'《机械姬》', book:'《看不见的城市》', outfit:'宽肩西装×真丝吊带、厚底靴×薄纱裙', personality:'喜欢刚性柔美的人，通常有两种看似矛盾的特质同时存在：你理性但敏感，你独立但渴望联结，你说话直接但内心柔软。你不喜欢被归类。你对质感有近乎偏执的敏感。你不追求"漂亮"，你追求"对"。', tags:['清醒','细腻','矛盾之美'] },
        '洛可可废土': { subtitle:'你相信末日也应该体面地过', visual:'一座废弃的巴洛克式大厅，水晶吊灯倾斜地悬在半空中，有几根蜡烛还在燃烧。地上散落着几件镶金边的礼服和断了跟的高跟鞋。大理石壁炉上放着一盘沾了灰的马卡龙。窗外是灰黄色的天空，远处有烟柱升起。但这里有人来过——蕾丝桌布上压着一本打开的诗集。', def:'将18世纪洛可可的精致繁复与末日废土的荒芜感并置的混合美学。', features:['精致×荒芜——珍珠、缎带、金箔放在生锈的金属和扬尘的背景下。','末日的讲究——世界要塌了，但桌布还是要铺平。','文明的遗物——物品比人活得更久。'], movie:'《疯狂的麦克斯：狂暴之路》', book:'《华氏451》', outfit:'蕾丝领口、破洞丝袜、旧缎带系在手腕上、珍珠耳环只剩一只', personality:'喜欢洛可可废土的人，大概有一种"不慌不忙"的气质。你不一定多坚强，但你觉得：如果真的要结束了，那至少得体面一点。你可能对"物件"有很深的情感。衣服穿了很久舍不得扔、杯子摔了想能不能粘回来。不是节俭，是你觉得它们替你记住了太多事。', tags:['体面','恋物','对结束有准备'] }
    };
    const QUESTIONS = [
        { id:1, dimension:'空间直觉', text:'你推开一扇门，面前是这样的空间，你更想走进去哪一个？', options:[{label:'A',text:'一座被藤蔓爬满的废弃石砌教堂，彩色玻璃投下暗红和紫蓝的光斑',style:'超现实暗黑童话'},{label:'B',text:'一个铺着水磨石地板的明亮中古公寓，窗外是棕榈树的影子',style:'海湾度假风'},{label:'C',text:'一个挑高极高的纯白房间，地面有一道窄长的光束，空气中飘着微尘',style:'神性极简'},{label:'D',text:'一条永远走不到尽头的走廊，日光灯忽明忽灭，铺着脏兮兮的菱格地砖',style:'怪核'}] },
        { id:2, dimension:'空间直觉', text:'在一个城市里，以下哪个角落最吸引你？', options:[{label:'A',text:'老城区里亮着霓虹招牌的电子修理铺，橱窗里摆着老式收音机',style:'旧未来主义'},{label:'B',text:'一片被改造成社区花园的废弃高架桥下，藤蔓爬满了水泥柱',style:'赛博田园'},{label:'C',text:'山丘上的白色小房子，门廊下有摇椅和猫，远处能看见海',style:'海湾度假风'},{label:'D',text:'美术馆里一个不起眼的角落，画框和墙壁之间有奇怪的缝隙',style:'怪核'}] },
        { id:3, dimension:'空间直觉', text:'如果你要在一间屋子里待上一整个下午，你希望它的窗户外面是什么？', options:[{label:'A',text:'一片漂浮在空中的浅粉色云团，远处有发光的水晶山脉',style:'云端造梦'},{label:'B',text:'邻居家的屋顶和晾晒的白色床单，在风里慢慢飘动，能看到远处教堂的尖顶',style:'海湾度假风'},{label:'C',text:'一个废弃的太空站内部，管道交错，远处有绿光在液体里缓缓浮动',style:'洛可可废土'},{label:'D',text:'一条开满樱花的河岸，夜里有灯笼，水面上倒映着烟花',style:'浮世绘暗夜'}] },
        { id:4, dimension:'空间直觉', text:'你更愿意在哪里读完一本小说？', options:[{label:'A',text:'一间点着线香的茶室，纸门上映着竹影，夜风里有远处祭典的鼓声',style:'浮世绘暗夜'},{label:'B',text:'一张被书堆包围的老书桌前，台灯的光圈刚好罩住书页',style:'神性极简'},{label:'C',text:'户外一张折叠椅上，远处有山和牧羊人的影子',style:'赛博田园'},{label:'D',text:'一个到处都是靠垫的角落，墙壁刷成浅薄荷色，有棉花糖形状的灯',style:'云端造梦'}] },
        { id:5, dimension:'时间感知', text:'以下哪种"旧"最让你着迷？', options:[{label:'A',text:'旧科幻杂志封面，上面画着穿着银色紧身衣的人站在环形太空站里',style:'旧未来主义'},{label:'B',text:'旧和服上的刺绣暗纹，是骷髅和牡丹花的图案',style:'浮世绘暗夜'},{label:'C',text:'旧照片里模糊的游乐场，颜色褪到几乎看不清，但能认出旋转木马',style:'怪核'},{label:'D',text:'旧金属表面的锈迹和划痕，被磨得发亮的不锈钢边缘',style:'刚性柔美'}] },
        { id:6, dimension:'时间感知', text:'你对"未来"最浪漫的想象是什么？', options:[{label:'A',text:'城市里布满空中花园，阳光穿过叶片，洒在干净的玻璃幕墙上',style:'赛博田园'},{label:'B',text:'人类穿着蓬松的彩色塑料衣服，住在圆形的泡泡屋里，相信一切都会更好',style:'旧未来主义'},{label:'C',text:'灾难已经过去，幸存者在废墟里重新穿上蕾丝和缎带，举办晚宴',style:'洛可可废土'},{label:'D',text:'每个人都在自己的漂浮小岛上生活，岛之间用彩虹色的桥连接',style:'云端造梦'}] },
        { id:7, dimension:'时间感知', text:'你更喜欢哪一种"日夜交替"？', options:[{label:'A',text:'黄昏，天色从淡粉变成深蓝，路灯还没亮，一切都暧昧不清',style:'超现实暗黑童话'},{label:'B',text:'暴风雨来临前，云层压得很低，风把金属板吹得微微震动',style:'刚性柔美'},{label:'C',text:'日落前最后一小时，阳光是金色的，拉出长长的影子',style:'海湾度假风'},{label:'D',text:'深夜，只有月光和霓虹灯，稻田里的机械昆虫在发光',style:'赛博田园'}] },
        { id:8, dimension:'时间感知', text:'如果时间是一个容器，你希望它是什么材质的？', options:[{label:'A',text:'钢化玻璃，能看到里面，但坚硬得敲不碎',style:'刚性柔美'},{label:'B',text:'陶土，粗糙、温暖、有手工留下的指纹',style:'神性极简'},{label:'C',text:'生锈的铁皮，边角卷曲，上面画着褪色的星星',style:'怪核'},{label:'D',text:'镀金的陶瓷，精致但有了裂纹，裂纹里填着灰',style:'洛可可废土'}] },
        { id:9, dimension:'材质情绪', text:'以下哪种颜色组合最打动你？', options:[{label:'A',text:'暗红、黑、金、墨绿',style:'超现实暗黑童话'},{label:'B',text:'靛蓝、银灰、白、枯叶黄',style:'浮世绘暗夜'},{label:'C',text:'灰白、米色、苔绿、旧铜色',style:'赛博田园'},{label:'D',text:'荧光粉、柠檬黄、克莱因蓝',style:'旧未来主义'}] },
        { id:10, dimension:'材质情绪', text:'你对以下哪种材质最有好感？', options:[{label:'A',text:'磨旧的天鹅绒，带一点光泽和粗糙的边缘',style:'洛可可废土'},{label:'B',text:'抛光的不锈钢表面，光洁但有一点指纹印',style:'刚性柔美'},{label:'C',text:'粗粝的石灰墙面，手指摸上去有粉末感',style:'神性极简'},{label:'D',text:'软绵绵的蓬松织物，像云朵或棉花糖的触感',style:'云端造梦'}] },
        { id:11, dimension:'材质情绪', text:'你被以下哪种画面吸引？', options:[{label:'A',text:'一座纯白色的几何建筑，站在里面只能听到自己的呼吸声',style:'神性极简'},{label:'B',text:'一株长在废弃电子屏幕里的绿植，屏幕裂了，但植物很茂盛',style:'赛博田园'},{label:'C',text:'一个穿着灰色和服的女子，站在深夜的海边，身后有烟花',style:'浮世绘暗夜'},{label:'D',text:'一个孩子坐在漂浮的床上，窗外是粉蓝色的云海和远方的光',style:'云端造梦'}] },
        { id:12, dimension:'材质情绪', text:'你更愿意触碰以下哪种物品？', options:[{label:'A',text:'一块边缘被磨圆的旧木头，上面有刻痕和岁月的凹痕',style:'怪核'},{label:'B',text:'一件镶着细小珍珠的纱裙，裙摆沾了一点泥土',style:'洛可可废土'},{label:'C',text:'一只冷冰冰的金属鸟笼，里面铺着干枯的玫瑰花瓣',style:'超现实暗黑童话'},{label:'D',text:'一个颜色鲜艳的塑料托盘，看起来像是60年代野餐用的',style:'旧未来主义'}] },
        { id:13, dimension:'叙事倾向', text:'一个故事里，主角最让你难忘的结局是？', options:[{label:'A',text:'她消失在森林深处，有人说看见她骑着一只巨大的黑兔子',style:'超现实暗黑童话'},{label:'B',text:'他没有拯救世界，而是开了一家修收音机的小店，每天听老唱片',style:'旧未来主义'},{label:'C',text:'她脱掉盔甲后，发现自己的身体早已布满裂纹，但裂纹里开出了花',style:'刚性柔美'},{label:'D',text:'他在镜子里看见了自己的另一个版本，然后对着镜子笑了笑',style:'怪核'}] },
        { id:14, dimension:'叙事倾向', text:'你更容易被哪种叙事风格打动？', options:[{label:'A',text:'精致、缓慢、每一帧都像油画，台词很少',style:'神性极简'},{label:'B',text:'华丽、浓烈、妖异，像一场盛大的梦魇',style:'浮世绘暗夜'},{label:'C',text:'明亮、温柔、有一点笨拙的善意',style:'云端造梦'},{label:'D',text:'破碎、拼接、似是而非，让人反复回想',style:'怪核'}] },
        { id:15, dimension:'叙事倾向', text:'你希望自己身处一部电影中，那部电影最可能是？', options:[{label:'A',text:'一部科幻片，但道具全是塑料的，色彩饱和度过高，配乐是电子合成器',style:'旧未来主义'},{label:'B',text:'一部文艺片，主角不说话，场景很少切换，光是唯一的对白',style:'神性极简'},{label:'C',text:'一部末日片，但幸存者们穿得很讲究，废墟里有人弹羽管键琴',style:'洛可可废土'},{label:'D',text:'一部奇幻片，主角跟着一只发光的小兽穿过田野，夜晚有星辰低语',style:'云端造梦'}] },
        { id:16, dimension:'叙事倾向', text:'一个故事结束后，你更希望留下什么？', options:[{label:'A',text:'一种挥之不去的潮湿的忧伤，像雨后的旧城堡',style:'超现实暗黑童话'},{label:'B',text:'一种凄艳的短暂，像一场烟花散尽后的寂静',style:'浮世绘暗夜'},{label:'C',text:'一种鲜活的渴望，想立刻买一张去海边的火车票',style:'海湾度假风'},{label:'D',text:'一种复杂的困惑，你忍不住翻回去再看一遍',style:'怪核'}] }
    ];
    const ACCESS_CODE = 'MOONRUST';
    const state = { current: 0, answers: new Array(QUESTIONS.length).fill(null) };
    const $ = (id) => document.getElementById(id);
    const pages = { home: $('pageHome'), test: $('pageTest'), result: $('pageResult') };
    function showPage(name) { Object.values(pages).forEach(p => p.classList.remove('active')); pages[name].classList.add('active'); window.scrollTo({ top: 0, behavior: 'smooth' }); }

    $('aboutLink').addEventListener('click', () => $('aboutModal').classList.add('show'));
    $('closeAbout').addEventListener('click', () => $('aboutModal').classList.remove('show'));
    $('aboutModal').addEventListener('click', (e) => { if (e.target === $('aboutModal')) $('aboutModal').classList.remove('show'); });

    function tryEnter() {
        const val = $('accessInput').value.trim();
        if (val === ACCESS_CODE) { $('accessError').classList.remove('show'); startTest(); }
        else {
            $('accessError').classList.add('show');
            const inp = $('accessInput'); inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.value = ''; inp.focus();
        }
    }
    $('accessEnter').addEventListener('click', tryEnter);
    $('accessInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryEnter(); });

    function startTest() { state.current = 0; state.answers = new Array(QUESTIONS.length).fill(null); showPage('test'); renderQuestion(); }

    function renderQuestion() {
        const q = QUESTIONS[state.current];
        $('dimensionLabel').textContent = q.dimension;
        $('questionText').textContent = q.text;
        $('progressText').textContent = (state.current + 1) + ' / ' + QUESTIONS.length;
        $('progressFill').style.width = ((state.current + 1) / QUESTIONS.length * 100) + '%';
        const container = $('optionsContainer'); container.innerHTML = '';
        q.options.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = 'opt' + (state.answers[state.current] === i ? ' selected' : '');
            div.innerHTML = '<span class="opt-label">' + opt.label + '</span>' + opt.text;
            div.addEventListener('click', () => selectOption(i));
            container.appendChild(div);
        });
        $('backBtn').classList.toggle('hidden', state.current === 0);
        const isLast = state.current === QUESTIONS.length - 1;
        $('resultBtn').classList.toggle('show', isLast && state.answers[state.current] !== null);
    }

    function selectOption(i) {
        state.answers[state.current] = i;
        const opts = $('optionsContainer').querySelectorAll('.opt');
        opts.forEach((el, idx) => el.classList.toggle('selected', idx === i));
        const isLast = state.current === QUESTIONS.length - 1;
        if (isLast) { $('resultBtn').classList.add('show'); }
        else { setTimeout(() => { state.current++; renderQuestion(); }, 280); }
    }

    $('backBtn').addEventListener('click', () => { if (state.current > 0) { state.current--; renderQuestion(); } });
    $('resultBtn').addEventListener('click', () => { if (state.answers.some(a => a === null)) return; renderResult(); showPage('result'); });

    function computeScores() {
        const scores = {}; STYLES.forEach(s => scores[s] = 0);
        state.answers.forEach((oi, qi) => { const style = QUESTIONS[qi].options[oi].style; scores[style] += 2; });
        return scores;
    }
    function getTopStyles(scores) {
        const arr = STYLES.map(s => ({ name: s, score: scores[s] }));
        arr.sort((a, b) => b.score - a.score || (Math.random() - 0.5));
        return arr;
    }

    function renderResult() {
        const scores = computeScores();
        const ranked = getTopStyles(scores);
        const main = ranked[0];
        const detail = STYLE_DETAIL[main.name];
        const top3 = ranked.slice(0, 3);
        const totalTop3 = top3.reduce((s, x) => s + x.score, 0) || 1;
        const spectrumHtml = top3.map((x) => {
            const pct = Math.round(x.score / totalTop3 * 100);
            return '<div class="spectrum-item"><span class="s-name">' + x.name + '</span><span class="s-bar-wrap"><span class="s-fill" style="background:' + STYLE_COLORS[x.name] + ';width:0%"></span></span><span class="s-pct">' + pct + '%</span></div>';
        }).join('');
        const featuresHtml = detail.features.map(f => '<li>' + f + '</li>').join('');
        const html =
            '<div class="result-header"><div class="result-name">' + main.name + '</div><div class="result-name-en">' + STYLE_EN[main.name] + '</div><div class="result-subtitle">' + detail.subtitle + '</div><div class="result-tags">' + detail.tags.map(t => '<span>' + t + '</span>').join('') + '</div></div>' +
            '<div class="result-spectrum"><div class="label">你的美学光谱</div>' + spectrumHtml + '</div>' +
            '<div class="result-section"><div class="sec-title">视觉氛围</div><div class="sec-body">' + detail.visual + '</div></div>' +
            '<div class="result-section"><div class="sec-title">美学档案</div><div class="sec-body"><div class="def">一句话定义：' + detail.def + '</div><ul>' + featuresHtml + '</ul><div class="rec"><strong>🎬 电影：</strong>' + detail.movie + '<br><strong>📖 书：</strong>' + detail.book + '<br><strong>👗 穿搭：</strong>' + detail.outfit + '</div></div></div>' +
            '<div class="result-section"><div class="sec-title">性格映射</div><div class="sec-body">' + detail.personality + '</div></div>' +
            '<div class="result-bottom"><button class="share-btn" id="shareBtn">生成分享卡片</button><button class="retest-btn" id="retestBtn">重新测试</button></div>';
        $('resultContent').innerHTML = html;
        setTimeout(() => {
            $('resultContent').querySelectorAll('.s-fill').forEach((el, idx) => { const pct = Math.round(top3[idx].score / totalTop3 * 100); el.style.width = pct + '%'; });
        }, 100);
        $('shareBtn').addEventListener('click', () => generateShareCard(main.name, top3, totalTop3));
        $('retestBtn').addEventListener('click', () => { startTest(); });
    }

    function drawRoundRect(ctx, x, y, w, h, r, fill) {
        if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
        ctx.fillStyle = fill; ctx.beginPath();
        ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath(); ctx.fill();
    }
    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        let line = '';
        for (let i = 0; i < text.length; i++) {
            const ch = text[i]; const test = line + ch;
            if (ctx.measureText(test).width > maxWidth && line.length > 0) { ctx.fillText(line, x, y); line = ch; y += lineHeight; }
            else { line = test; }
        }
        ctx.fillText(line, x, y);
    }

    function generateShareCard(mainName, top3, totalTop3) {
        const W = 1080, H = 1350;
        const canvas = $('shareCanvas'); canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        const detail = STYLE_DETAIL[mainName]; const mainColor = STYLE_COLORS[mainName];
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function () {
            drawCard(canvas, ctx, img, mainName, detail, mainColor, top3, totalTop3, W, H);
        };
        img.onerror = function () {
            drawCard(canvas, ctx, null, mainName, detail, mainColor, top3, totalTop3, W, H);
        };
        img.src = 'assets/styles/' + encodeURIComponent(mainName) + '.jpg';
    }
    function drawCard(canvas, ctx, img, mainName, detail, mainColor, top3, totalTop3, W, H) {
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
        // 顶部插画区（占上方 720px）
        const imgH = 720;
        if (img) {
            // cover 拉伸
            const ir = img.width / img.height;
            const cr = W / imgH;
            let sw, sh, sx, sy;
            if (ir > cr) { sh = img.height; sw = sh * cr; sx = (img.width - sw) / 2; sy = 0; }
            else { sw = img.width; sh = sw / cr; sx = 0; sy = (img.height - sh) / 2; }
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, imgH);
        } else {
            ctx.fillStyle = mainColor; ctx.fillRect(0, 0, W, imgH);
        }
        // 插画底部渐变过渡到白
        const grad = ctx.createLinearGradient(0, imgH - 160, 0, imgH);
        grad.addColorStop(0, 'rgba(255,255,255,0)');
        grad.addColorStop(1, 'rgba(255,255,255,1)');
        ctx.fillStyle = grad; ctx.fillRect(0, imgH - 160, W, 160);
        // 顶部色条
        ctx.fillStyle = mainColor; ctx.fillRect(0, 0, W, 14);

        const padX = 90; let y = imgH + 40;
        ctx.fillStyle = '#bbbbbb'; ctx.font = '300 30px "Helvetica Neue", Arial, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText('和你相配的小众美学', padX, y);
        y += 90;
        ctx.fillStyle = '#1e1e1e'; ctx.font = '700 60px Georgia, "宋体", serif';
        y = wrapTextY(ctx, mainName, padX, y, W - padX * 2, 76);
        y += 56;
        ctx.fillStyle = '#bbbbbb'; ctx.font = '400 28px "Helvetica Neue", Arial, sans-serif';
        ctx.fillText(STYLE_EN[mainName], padX, y);
        y += 56;
        ctx.fillStyle = '#888888'; ctx.font = 'italic 34px Georgia, "宋体", serif';
        y = wrapTextY(ctx, detail.subtitle, padX, y, W - padX * 2, 48);
        y += 70;
        ctx.font = '400 26px "Helvetica Neue", Arial, sans-serif';
        let tx = padX;
        detail.tags.forEach(t => {
            const w = ctx.measureText(t).width + 48;
            drawRoundRect(ctx, tx, y - 30, w, 48, 24, '#f0efec');
            ctx.fillStyle = '#444444'; ctx.textAlign = 'center'; ctx.fillText(t, tx + w / 2, y + 2);
            tx += w + 16; ctx.textAlign = 'left';
        });
        y += 60;
        ctx.strokeStyle = '#f0efec'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(padX, y); ctx.lineTo(W - padX, y); ctx.stroke();
        y += 50;
        ctx.fillStyle = '#bbbbbb'; ctx.font = '300 26px "Helvetica Neue", Arial, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText('你的美学光谱', padX, y);
        y += 24;
        top3.forEach((x) => {
            const pct = Math.round(x.score / totalTop3 * 100); y += 50;
            ctx.fillStyle = '#555555'; ctx.font = '400 26px Georgia, "宋体", serif'; ctx.textAlign = 'left';
            ctx.fillText(x.name, padX, y);
            ctx.fillStyle = '#999999'; ctx.font = '400 24px "Helvetica Neue", Arial, sans-serif'; ctx.textAlign = 'right';
            ctx.fillText(pct + '%', W - padX, y);
            const barY = y + 16; const barW = W - padX * 2;
            drawRoundRect(ctx, padX, barY, barW, 12, 6, '#ececec');
            drawRoundRect(ctx, padX, barY, barW * pct / 100, 12, 6, STYLE_COLORS[x.name]);
        });
        ctx.fillStyle = '#e0e0e0'; ctx.font = '300 22px "Helvetica Neue", Arial, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('16道题 · 10种风格', W / 2, H - 50);
        const link = document.createElement('a');
        link.download = mainName + '-美学卡片.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
    function wrapTextY(ctx, text, x, y, maxWidth, lineHeight) {
        let line = '';
        for (let i = 0; i < text.length; i++) {
            const ch = text[i]; const test = line + ch;
            if (ctx.measureText(test).width > maxWidth && line.length > 0) { ctx.fillText(line, x, y); line = ch; y += lineHeight; }
            else { line = test; }
        }
        ctx.fillText(line, x, y); return y;
    }

    $('accessInput').focus();
    </script>
</body>
</html>
